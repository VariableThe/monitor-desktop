[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-desktop"
version = "0.2.1"
description = "Linux-first desktop monitoring and remote-control app for Sony cameras"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aditya" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "gphoto2>=2.6.0; sys_platform != 'win32'",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "PySide6>=6.8,<7",
]

[project.scripts]
monitor-desktop = "monitor_desktop.app:main"

[tool.setuptools]
packages = ["monitor_desktop"]

[tool.setuptools.package-data]
monitor_desktop = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]
